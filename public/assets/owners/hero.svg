<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e7d6"/><stop offset="1" stop-color="#e2cdb0"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0f2"/><stop offset="1" stop-color="#f6e7c8"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98d5d"/><stop offset="1" stop-color="#8a6238"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6dc" stop-opacity=".75"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <!-- window -->
  <rect x="980" y="120" width="720" height="560" rx="6" fill="#fdf8ee"/>
  <rect x="1000" y="140" width="680" height="520" fill="url(#sky)"/>
  <g fill="#9fbfb8" opacity=".85">
    <rect x="1010" y="470" width="90" height="190"/><rect x="1110" y="410" width="110" height="250"/><rect x="1230" y="500" width="80" height="160"/>
    <rect x="1320" y="380" width="120" height="280"/><rect x="1450" y="450" width="90" height="210"/><rect x="1550" y="420" width="120" height="240"/>
  </g>
  <path d="M1340 140v520M1000 400h680" stroke="#fdf8ee" stroke-width="14"/>
  <polygon points="980,120 1700,120 1500,1080 700,1080" fill="url(#light)"/>
  <!-- floor -->
  <rect y="760" width="1920" height="320" fill="url(#floor)"/>
  <rect y="750" width="1920" height="14" fill="#f8f2e8"/>
  <!-- sofa -->
  <rect x="150" y="540" width="760" height="240" rx="40" fill="#155247"/>
  <rect x="190" y="470" width="680" height="170" rx="46" fill="#1e6b5a"/>
  <rect x="120" y="580" width="90" height="200" rx="38" fill="#0b312b"/>
  <rect x="850" y="580" width="90" height="200" rx="38" fill="#0b312b"/>
  <rect x="260" y="500" width="190" height="130" rx="26" fill="#c9500a"/>
  <rect x="470" y="505" width="170" height="125" rx="26" fill="#f1c27d"/>
  <!-- rug and table -->
  <ellipse cx="620" cy="900" rx="520" ry="90" fill="#efe3cf" opacity=".9"/>
  <rect x="470" y="820" width="300" height="26" rx="8" fill="#6b4a2b"/>
  <rect x="500" y="846" width="14" height="60" fill="#6b4a2b"/><rect x="726" y="846" width="14" height="60" fill="#6b4a2b"/>
  <!-- plant -->
  <rect x="1540" y="640" width="80" height="130" rx="10" fill="#c9500a"/>
  <g fill="#2f7a4f"><ellipse cx="1580" cy="560" rx="40" ry="100"/><ellipse cx="1530" cy="590" rx="34" ry="80" transform="rotate(-24 1530 590)"/><ellipse cx="1630" cy="590" rx="34" ry="80" transform="rotate(24 1630 590)"/></g>
  <!-- frame on wall -->
  <rect x="300" y="170" width="360" height="240" rx="6" fill="#0f1f2e"/><rect x="318" y="188" width="324" height="204" fill="#f3e7d6"/>
  <path d="M318 360l90-90 70 60 60-50 104 100v22H318z" fill="#1e6b5a"/><circle cx="560" cy="248" r="28" fill="#c9500a"/>
</svg>
